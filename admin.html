<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — MindSnap</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060608;--surface:#0f0f14;--surface2:#16161f;--surface3:#1e1e2a;
  --text:#eeeaf8;--muted:#6b6880;--muted2:#9994ad;
  --accent:#7c3aed;--neon:#c084fc;--neon2:#06b6d4;
  --red:#f43f5e;--green:#10b981;--gold:#f59e0b;
  --border:rgba(124,58,237,0.15);--border2:rgba(255,255,255,0.06);
}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;padding:0 1rem 5rem;overflow-x:hidden}
body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(244,63,94,0.08) 0%,transparent 70%);pointer-events:none;z-index:0}
.page{max-width:680px;margin:0 auto;position:relative;z-index:1}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0 1.5rem}
.logo{font-family:'Syne',sans-serif;font-size:0.8rem;font-weight:900;letter-spacing:0.15em;text-transform:uppercase;background:linear-gradient(135deg,#f43f5e,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.btn-sm{background:var(--surface2);border:1px solid var(--border2);border-radius:999px;padding:5px 14px;font-family:'Space Grotesk',sans-serif;font-size:0.72rem;font-weight:700;color:var(--muted2);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}

.hero{padding:0.5rem 0 1.5rem}
.hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--red);border:1px solid rgba(244,63,94,0.3);border-radius:999px;padding:4px 12px;margin-bottom:1rem}
.hero-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:900}

.tabs{display:flex;background:var(--surface2);border-radius:14px;padding:4px;margin-bottom:1.5rem;gap:4px;overflow-x:auto}
.tab{flex:1;padding:0.65rem 0.5rem;border-radius:10px;font-family:'Space Grotesk',sans-serif;font-size:0.74rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s;text-align:center;white-space:nowrap}
.tab.active{background:var(--surface3);color:var(--text)}

.tab-content{display:none}
.tab-content.active{display:block}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;margin-bottom:1rem}
.stat-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:1.1rem}
.stat-n{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:900;display:block;line-height:1;margin-bottom:5px}
.stat-l{font-size:0.65rem;color:var(--muted);font-weight:700;letter-spacing:0.05em;text-transform:uppercase}

.section-title{font-size:0.65rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:1.5rem 0 0.75rem}

.user-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:1rem 1.1rem;margin-bottom:0.6rem;display:flex;align-items:center;gap:0.85rem}
.u-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--neon));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.9rem;color:white;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-weight:700;font-size:0.88rem;display:flex;align-items:center;gap:6px}
.u-email{font-size:0.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-meta{font-size:0.65rem;color:var(--muted2);margin-top:2px}
.u-badge{font-size:0.55rem;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.u-badge.admin{background:rgba(244,63,94,0.15);color:var(--red)}
.u-badge.premium{background:rgba(245,158,11,0.15);color:var(--gold)}
.u-actions{display:flex;gap:6px;flex-shrink:0}
.u-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:0.68rem;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap}
.u-btn.danger{color:var(--red);border-color:rgba(244,63,94,0.25)}
.u-btn.gold{color:var(--gold);border-color:rgba(245,158,11,0.25)}

.comment-card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:0.9rem 1rem;margin-bottom:0.6rem}
.c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.4rem}
.c-name{font-size:0.78rem;font-weight:700}
.c-meta{font-size:0.62rem;color:var(--muted)}
.c-text{font-size:0.82rem;color:var(--muted2);line-height:1.5;margin-bottom:0.5rem}
.c-del{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);color:var(--red);border-radius:8px;padding:4px 10px;font-size:0.65rem;font-weight:700;cursor:pointer}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:1rem;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s;background:var(--gold)}
.dots span:nth-child(3){animation-delay:.4s;background:var(--neon)}
@keyframes pulse{0%,80%,100%{transform:scale(0.6);opacity:0.35}40%{transform:scale(1);opacity:1}}

.denied{text-align:center;padding:4rem 1rem}
.denied-icon{font-size:3rem;margin-bottom:1rem}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:0.85rem}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:var(--bg);padding:0.75rem 1.5rem;border-radius:999px;font-size:0.82rem;font-weight:700;transition:transform 0.3s ease;pointer-events:none;white-space:nowrap;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="page">
  <div class="top-bar">
    <a href="/" class="logo">MindSnap Admin</a>
    <a href="/dashboard.html" class="btn-sm">← Dashboard</a>
  </div>

  <div id="loading-screen" class="loading-screen">
    <div class="dots"><span></span><span></span><span></span></div>
    <span style="font-size:0.85rem">Vérification des accès...</span>
  </div>

  <div id="denied-screen" class="denied" style="display:none">
    <div class="denied-icon">🚫</div>
    <h2 style="font-family:'Syne',sans-serif;margin-bottom:0.5rem">Accès refusé</h2>
    <p style="color:var(--muted);font-size:0.85rem">Cette page est réservée à l'administrateur.</p>
  </div>

  <div id="main-content" style="display:none">
    <div class="hero">
      <div class="hero-tag">🛡️ Zone Administrateur</div>
      <div class="hero-title">Tableau de bord</div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('stats')">📊 Stats</button>
      <button class="tab" onclick="switchTab('users')">👥 Utilisateurs</button>
      <button class="tab" onclick="switchTab('comments')">💬 Commentaires</button>
    </div>

    <!-- STATS TAB -->
    <div class="tab-content active" id="tab-stats">
      <div class="stats-grid" id="stats-grid"></div>
    </div>

    <!-- USERS TAB -->
    <div class="tab-content" id="tab-users">
      <div id="users-list"></div>
    </div>

    <!-- COMMENTS TAB -->
    <div class="tab-content" id="tab-comments">
      <div id="comments-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var session = null;
try { session = JSON.parse(localStorage.getItem('ms_session')); } catch(e) {}

if (!session || !session.id) {
  window.location.href = '/login.html';
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

function switchTab(name) {
  var names = ['stats','users','comments'];
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', names[i]===name); });
  document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
  document.getElementById('tab-'+name).classList.add('active');
  if (name === 'users') loadUsers();
  if (name === 'comments') loadComments();
}

async function callAdmin(action, extra) {
  var payload = Object.assign({ action: action, requesterId: session.id }, extra || {});
  var res = await fetch('/api/admin', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  return res.json();
}

function getInitial(name) { return (name||'?')[0].toUpperCase(); }
function fmtDate(d) {
  return new Date(d).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
}

async function init() {
  try {
    var data = await callAdmin('stats');
    if (data.error) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('denied-screen').style.display = 'block';
      return;
    }
    renderStats(data);
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
  } catch(e) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('denied-screen').style.display = 'block';
  }
}

function renderStats(s) {
  var grid = document.getElementById('stats-grid');
  grid.innerHTML =
    '<div class="stat-card"><span class="stat-n" style="color:var(--neon)">'+s.totalUsers+'</span><span class="stat-l">Utilisateurs</span></div>'
    + '<div class="stat-card"><span class="stat-n" style="color:var(--gold)">'+s.premiumUsers+'</span><span class="stat-l">Premium</span></div>'
    + '<div class="stat-card"><span class="stat-n" style="color:var(--green)">'+s.estimatedMonthlyRevenue+'$</span><span class="stat-l">Revenu mensuel est.</span></div>'
    + '<div class="stat-card"><span class="stat-n" style="color:var(--neon2)">'+s.newThisWeek+'</span><span class="stat-l">Nouveaux (7j)</span></div>'
    + '<div class="stat-card"><span class="stat-n">'+s.totalSessions+'</span><span class="stat-l">Sessions jouées</span></div>'
    + '<div class="stat-card"><span class="stat-n">'+s.totalComments+'</span><span class="stat-l">Commentaires</span></div>';
}

async function loadUsers() {
  var el = document.getElementById('users-list');
  el.innerHTML = '<div class="empty">Chargement…</div>';
  var data = await callAdmin('listUsers');
  var users = data.users || [];
  if (users.length === 0) { el.innerHTML = '<div class="empty">Aucun utilisateur.</div>'; return; }

  el.innerHTML = users.map(function(u) {
    var badges = '';
    if (u.is_admin) badges += '<span class="u-badge admin">Admin</span>';
    if (u.premium) badges += '<span class="u-badge premium">👑 '+(u.premium_plan||'')+'</span>';
    return '<div class="user-card">'
      + '<div class="u-avatar">'+getInitial(u.name)+'</div>'
      + '<div class="u-info">'
      + '<div class="u-name">'+u.name+' '+badges+'</div>'
      + '<div class="u-email">'+u.email+'</div>'
      + '<div class="u-meta">'+fmtDate(u.created_at)+' · '+(u.total_sessions||0)+' sessions</div>'
      + '</div>'
      + '<div class="u-actions">'
      + (u.premium
          ? '<button class="u-btn" onclick="togglePremium(\''+u.id+'\', false)">Retirer</button>'
          : '<button class="u-btn gold" onclick="togglePremium(\''+u.id+'\', true)">+Premium</button>')
      + (u.is_admin ? '' : '<button class="u-btn danger" onclick="deleteUser(\''+u.id+'\', \''+u.name.replace(/'/g,"")+'\')">Suppr.</button>')
      + '</div>'
      + '</div>';
  }).join('');
}

async function togglePremium(targetId, enable) {
  var plan = 'monthly';
  if (enable) {
    var choice = confirm('OK = Plan annuel, Annuler = Plan mensuel');
    plan = choice ? 'yearly' : 'monthly';
  }
  await callAdmin('togglePremium', { targetUserId: targetId, premium: enable, plan: plan });
  toast(enable ? 'Premium activé ✓' : 'Premium retiré');
  loadUsers();
}

async function deleteUser(targetId, name) {
  if (!confirm('Supprimer le compte de ' + name + ' ? Action irréversible.')) return;
  await callAdmin('deleteUser', { targetUserId: targetId });
  toast('Compte supprimé');
  loadUsers();
}

async function loadComments() {
  var el = document.getElementById('comments-list');
  el.innerHTML = '<div class="empty">Chargement…</div>';
  var data = await callAdmin('listComments');
  var comments = data.comments || [];
  if (comments.length === 0) { el.innerHTML = '<div class="empty">Aucun commentaire.</div>'; return; }

  el.innerHTML = comments.map(function(c) {
    return '<div class="comment-card">'
      + '<div class="c-top"><span class="c-name">'+(c.mood||'')+' '+c.author_name+'</span><span class="c-meta">'+fmtDate(c.created_at)+'</span></div>'
      + '<div class="c-text">'+c.text+'</div>'
      + '<button class="c-del" onclick="deleteComment(\''+c.id+'\')">🗑️ Supprimer</button>'
      + '</div>';
  }).join('');
}

async function deleteComment(commentId) {
  if (!confirm('Supprimer ce commentaire ?')) return;
  await callAdmin('deleteComment', { commentId: commentId });
  toast('Commentaire supprimé');
  loadComments();
}

init();
</script>
</body>
</html>
