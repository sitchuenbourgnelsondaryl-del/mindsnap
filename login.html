<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MindSnap</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060608;--surface:#0f0f14;--surface2:#16161f;--surface3:#1e1e2a;
  --text:#eeeaf8;--muted:#6b6880;--muted2:#9994ad;
  --accent:#7c3aed;--neon:#c084fc;--neon2:#06b6d4;
  --red:#f43f5e;--green:#10b981;
  --border:rgba(124,58,237,0.15);--border2:rgba(255,255,255,0.06);
}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden}
body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(124,58,237,0.15) 0%,transparent 70%);pointer-events:none}
.wrap{width:100%;max-width:400px;position:relative;z-index:1}
.logo{font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:900;letter-spacing:0.15em;text-transform:uppercase;background:linear-gradient(135deg,var(--neon),var(--neon2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;margin-bottom:2.5rem;display:block}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:24px;padding:2rem;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--neon),var(--neon2))}
.tabs{display:flex;gap:0;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:1.75rem}
.tab{flex:1;padding:0.6rem;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all 0.2s}
.tab.active{background:var(--surface3);color:var(--text)}
.field{margin-bottom:1rem}
label{display:block;font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem}
input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:0.85rem 1rem;font-family:'Space Grotesk',sans-serif;font-size:0.92rem;color:var(--text);outline:none;transition:border-color 0.15s}
input:focus{border-color:rgba(124,58,237,0.4)}
input::placeholder{color:var(--muted)}
.btn-submit{width:100%;padding:1rem;border-radius:12px;background:linear-gradient(135deg,var(--accent),#6d28d9);color:white;font-family:'Space Grotesk',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;border:none;margin-top:0.5rem;transition:opacity 0.15s;position:relative;overflow:hidden}
.btn-submit::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);pointer-events:none}
.btn-submit:hover{opacity:0.9}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed}
.error-msg{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.3);border-radius:10px;padding:0.75rem 1rem;font-size:0.8rem;color:var(--red);margin-bottom:1rem;display:none}
.error-msg.show{display:block}
.success-msg{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:10px;padding:0.75rem 1rem;font-size:0.8rem;color:var(--green);margin-bottom:1rem;display:none}
.success-msg.show{display:block}
.divider{display:flex;align-items:center;gap:0.75rem;margin:1.25rem 0;color:var(--muted);font-size:0.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.btn-guest{width:100%;padding:0.9rem;border-radius:12px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted2);font-family:'Space Grotesk',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-guest:hover{border-color:var(--border);color:var(--text)}
.back-link{text-align:center;margin-top:1.5rem;font-size:0.78rem;color:var(--muted)}
.back-link a{color:var(--neon);text-decoration:none;font-weight:600}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <span class="logo">MindSnap</span>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Inscription</button>
    </div>
    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <!-- LOGIN -->
    <div id="form-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="ton@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-submit" id="btn-login" onclick="doLogin()">Se connecter</button>
    </div>

    <!-- REGISTER -->
    <div id="form-register" style="display:none">
      <div class="field">
        <label>Pseudo</label>
        <input type="text" id="reg-name" placeholder="Ton prénom ou pseudo">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="ton@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="reg-pass" placeholder="Min. 6 caractères" autocomplete="new-password">
      </div>
      <button class="btn-submit" id="btn-register" onclick="doRegister()">Créer mon compte</button>
    </div>

    <div class="divider">ou</div>
    <button class="btn-guest" onclick="guestMode()">👀 Continuer sans compte</button>
  </div>
  <div class="back-link"><a href="/">&#8592; Retour à l'accueil</a></div>
</div>

<script>
function showError(msg) {
  var el = document.getElementById('error-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('success-msg').classList.remove('show');
}
function showSuccess(msg) {
  var el = document.getElementById('success-msg');
  el.textContent = msg; el.classList.add('show');
  document.getElementById('error-msg').classList.remove('show');
}
function clearMsgs() {
  document.getElementById('error-msg').classList.remove('show');
  document.getElementById('success-msg').classList.remove('show');
}
function setLoading(btnId, loading) {
  var btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Chargement...';
  } else {
    btn.disabled = false;
    btn.innerHTML = btnId === 'btn-login' ? 'Se connecter' : 'Créer mon compte';
  }
}
function switchTab(tab) {
  clearMsgs();
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
}

async function doLogin() {
  clearMsgs();
  var email = document.getElementById('login-email').value.trim();
  var pass = document.getElementById('login-pass').value;
  if (!email || !pass) return showError('Remplis tous les champs.');
  setLoading('btn-login', true);
  try {
    var res = await fetch('/api/auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'login', email: email, password: pass})
    });
    var data = await res.json();
    if (data.error) { showError(data.error); setLoading('btn-login', false); return; }
    localStorage.setItem('ms_session', JSON.stringify(data.user));
    if (data.user.premium) localStorage.setItem('ip', '1');
    applyUserTheme(data.user.name);
    showSuccess('Connexion réussie ! Redirection...');
    setTimeout(function() { window.location.href = '/dashboard.html'; }, 700);
  } catch(e) {
    showError('Erreur serveur. Réessaie.');
    setLoading('btn-login', false);
  }
}

async function doRegister() {
  clearMsgs();
  var name = document.getElementById('reg-name').value.trim();
  var email = document.getElementById('reg-email').value.trim();
  var pass = document.getElementById('reg-pass').value;
  if (!name || !email || !pass) return showError('Remplis tous les champs.');
  if (pass.length < 6) return showError('Mot de passe trop court (min. 6 caractères).');
  setLoading('btn-register', true);
  try {
    var res = await fetch('/api/auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'register', email: email, password: pass, name: name})
    });
    var data = await res.json();
    if (data.error) { showError(data.error); setLoading('btn-register', false); return; }
    localStorage.setItem('ms_session', JSON.stringify(data.user));
    applyUserTheme(data.user.name);
    showSuccess('Compte créé ! Redirection...');
    setTimeout(function() { window.location.href = '/dashboard.html'; }, 700);
  } catch(e) {
    showError('Erreur serveur. Réessaie.');
    setLoading('btn-register', false);
  }
}

function guestMode() {
  localStorage.setItem('ms_session', JSON.stringify({email:'guest', name:'Invité', premium:false, guest:true}));
  window.location.href = '/';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var loginVisible = document.getElementById('form-login').style.display !== 'none';
    if (loginVisible) doLogin(); else doRegister();
  }
});


function getUserTheme(name) {
  if (!name || name === 'Invite') return null;
  var themes = [
    {accent:'#7c3aed',neon:'#c084fc',neon2:'#06b6d4'},
    {accent:'#db2777',neon:'#f472b6',neon2:'#fb923c'},
    {accent:'#0891b2',neon:'#22d3ee',neon2:'#34d399'},
    {accent:'#dc2626',neon:'#f87171',neon2:'#fbbf24'},
    {accent:'#059669',neon:'#34d399',neon2:'#60a5fa'},
    {accent:'#7c3aed',neon:'#a78bfa',neon2:'#f472b6'},
    {accent:'#b45309',neon:'#fbbf24',neon2:'#34d399'},
    {accent:'#1d4ed8',neon:'#60a5fa',neon2:'#c084fc'},
  ];
  var hash = 0;
  for (var i=0;i<name.length;i++){hash=((hash<<5)-hash)+name.charCodeAt(i);hash|=0;}
  return themes[Math.abs(hash)%themes.length];
}
function hexToRgb(hex){
  return parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16);
}
function applyUserTheme(name) {
  var theme = getUserTheme(name);
  if (!theme) return;
  var r = document.documentElement;
  r.style.setProperty('--accent',theme.accent);
  r.style.setProperty('--neon',theme.neon);
  r.style.setProperty('--neon2',theme.neon2);
  r.style.setProperty('--border','rgba('+hexToRgb(theme.accent)+',0.15)');
  var s=document.createElement('style');
  s.textContent='body::before{background:radial-gradient(ellipse,rgba('+hexToRgb(theme.accent)+',0.12) 0%,transparent 70%)!important}';
  document.head.appendChild(s);
}

// Apply theme on load
var _s=null;try{_s=JSON.parse(localStorage.getItem('ms_session'));}catch(e){}
if(_s&&_s.name) applyUserTheme(_s.name);

// Redirect if already logged in
var sess = null;
try { sess = JSON.parse(localStorage.getItem('ms_session')); } catch(e) {}
if (sess && sess.id) window.location.href = '/dashboard.html';
</script>
</body>
</html>
